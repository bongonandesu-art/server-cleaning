<style>
*{box-sizing:border-box}
:root{
  --text:#263238;--muted:#66727a;--line:#d9dee1;--navy:#29434e;--blue-outline:#8fc7d8;
  --beer-card:#fff9df;--sour-card:#e9f8fc;--setup-card:#f3f5f6;

}
html,body{margin:0;padding:0;min-height:100%;background:var(--page);color:var(--text);
  font-family:"Zen Maru Gothic",-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.app-header{position:sticky;top:0;z-index:20;height:var(--header-height);padding-top:env(safe-area-inset-top);
  background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:54px minmax(0,1fr) 116px;align-items:center}
.header-left{min-width:0;height:100%;display:flex;align-items:center;justify-content:flex-start}
.header-menu{width:54px;height:100%;border:0;background:transparent;color:var(--navy);font-size:23px}
.header-menu:hover{background:#f5f7f8}
.header-center{min-width:0;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.title-block{min-width:0;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.title-main{display:flex;align-items:center;justify-content:center;min-width:0;max-width:100%;height:42px}
.beer-emoji{flex:0 0 auto;font-size:42px;line-height:1;user-select:none;opacity:.85;margin-right:-18px;pointer-events:none}
.app-title-text{position:relative;z-index:1;min-width:0;max-width:100%;margin:0;padding:0 2px;
  font-size:clamp(21px,3.2vw,28px);font-weight:700;letter-spacing:.04em;white-space:nowrap;color:var(--text);
  font-family:"Zen Maru Gothic",sans-serif;text-shadow:-.6px -.6px 0 var(--blue-outline),.6px -.6px 0 var(--blue-outline),-.6px .6px 0 var(--blue-outline),.6px .6px 0 var(--blue-outline)}
.app-title-version{display:block;margin-top:-1px;font-size:11px;font-weight:700;letter-spacing:.03em;white-space:nowrap;color:var(--navy)}
.header-right{min-width:0;height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
.store-name,.shop-badge-option{width:116px;height:52px;padding:1px 2px;display:flex;align-items:center;justify-content:center;
  text-align:center;border-radius:6px;border:1px solid transparent;box-shadow:0 2px 5px rgba(0,0,0,.08);position:relative;overflow:hidden}
.store-name-text{display:-webkit-box;width:100%;max-width:100%;font-size:21px;line-height:1.05;font-weight:700;

.shop-badge-01{background:#8B4513;color:#fff;border-color:transparent}
.shop-badge-02{background:#FFFF00;color:#000;border-color:#000}

.shop-badge-04{background:#F5F5DC;color:#000;border-color:#000}

.shop-badge-06{background:#3b82f6;color:#fff;border-color:transparent}
.shop-badge-07{background:#008080;color:#fff;border-color:transparent}
.shop-badge-08{background:#8b5cf6;color:#fff;border-color:transparent}
.shop-badge-09{background:#ec4899;color:#fff;border-color:transparent}
.shop-badge-10{background:#6b7280;color:#fff;border-color:transparent}

.shop-badge-option{flex:0 0 auto}
.shop-badge-option.selected{outline:3px solid var(--navy);outline-offset:2px}

.shop-badge-option.shop-badge-04{border-color:#000}
.app-main{width:min(760px,100%);margin:0 auto}
.fixed-controls{position:sticky;top:var(--header-height);z-index:15;background:rgba(255,255,255,.97);

.tabs{display:grid;grid-template-columns:repeat(3,1fr)}
.tab{min-height:48px;border:0;border-right:1px solid var(--line);background:#f5f7f8;color:#4b5960;font-weight:700;font-size:14px}
.tab:last-child{border-right:0}
.tab.active{background:#fff;color:var(--navy);box-shadow:inset 0 -3px 0 var(--navy)}
.action-row{display:flex;gap:10px;padding:10px 12px}
.action-row button{flex:1;min-height:46px;border-radius:8px;border:1px solid var(--navy);font-weight:700}
.primary-button{background:var(--button);color:var(--button-text)}

.field{margin-bottom:14px}

.add-button-wrap{margin-top:20px;display:flex;justify-content:flex-start}

.optional-item-box{margin-top:10px;padding-top:12px;border-top:1px solid #d5dade}

.choice-list{display:flex;flex-direction:column;gap:8px}
.choice{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;min-height:50px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
.choice input{width:22px;height:22px}
.m2-item-choices{display:flex;flex-direction:column;gap:8px}
.m2-item-choice{grid-template-columns:auto minmax(0,1fr)}
.m2-servers{margin-top:22px}

.m2-server-list{display:flex;flex-direction:column;gap:10px}

.m2-server-tile input{width:23px;height:23px}
.m2-server-name{font-weight:800;overflow-wrap:anywhere}
.menu-backdrop,.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.42)}
.menu-backdrop{display:flex}
.menu-drawer{width:min(360px,88vw);height:100%;background:#fff;padding:24px 18px;box-shadow:8px 0 30px rgba(0,0,0,.18);will-change:transform}
.menu-drawer h2{margin:0 0 18px;color:var(--navy)}
.menu-item{display:block;width:100%;text-align:left;min-height:48px;border:0;border-bottom:1px solid var(--line);background:#fff;color:var(--text);font-weight:700}
.menu-item-danger{color:#b42318}
.menu-note{font-size:12px;color:var(--muted);line-height:1.6}
.modal-backdrop{display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(420px,100%);background:#fff;border-radius:12px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.22)}
.modal h2{margin:0 0 10px;font-size:19px}
.modal p{line-height:1.6;margin:0 0 18px}
.modal-actions{display:flex;gap:10px}
.modal-actions button{flex:1;min-height:46px;border-radius:8px;font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;background:#263238;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 5px 20px rgba(0,0,0,.2)}
@media(max-width:480px){
  .item-config{grid-template-columns:1fr 78px auto}
  .item-signal-label{font-size:11px}
  .section-title::before,.section-title::after{width:20%}
  .app-header{grid-template-columns:48px minmax(0,1fr) 104px}
  .header-menu{width:48px}
  .header-right{padding-right:4px}
  .store-name,.shop-badge-option{width:104px;height:50px;padding:1px 2px}
  .store-name{flex-basis:104px}
  .store-name-text{font-size:21px}
  .app-title-text{font-size:clamp(19px,6.2vw,23px);letter-spacing:.02em}
  .beer-emoji{font-size:34px;margin-right:-15px}
  .app-title-version{font-size:10px}
}

function createEmptyData(){return{version:2,shopName:"",shopBadgeColor:DEFAULT_SHOP_BADGE_COLOR,servers:[createServer("beer","ビールサーバー1"),createServer("sour","A1")],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}}
function createServer(type,name=""){return{id:crypto.randomUUID(),type,name,items:DEFAULT_ITEMS[type].map(item=>createItem(item))}}
function createItem(source){return{id:crypto.randomUUID(),name:source.name||"",days:Math.max(1,Number(source.days)||7),signal:source.signal!==false,history:Array.isArray(source.history)?[...source.history]:[],lastCleanedAt:source.lastCleanedAt||null}}
function cloneItem(item){return{id:item.id,name:item.name,days:Math.max(1,Number(item.days)||7),signal:item.signal!==false,history:Array.isArray(item.history)?[...item.history]:[],lastCleanedAt:item.lastCleanedAt||null}}

function serverSnapshot(server){return JSON.parse(JSON.stringify(cloneServer(server)))}
function restoreServerSnapshot(serverId){const snapshot=setupSnapshots.get(serverId);if(!snapshot)return false;const index=appData.servers.findIndex(s=>s.id===serverId);if(index<0)return false;appData.servers[index]=JSON.parse(JSON.stringify(snapshot));return true}
function readServerCard(card){const server=appData.servers.find(x=>x.id===card.dataset.serverId);if(!server)return null;const nameInput=card.querySelector(".server-name-input");const newName=nameInput?nameInput.value.trim():server.name;const rows=[...card.querySelectorAll(".item-config")].slice(0,3);const items=rows.map((row)=>{const select=row.querySelector(".item-select-box");const customInput=row.querySelector(".item-custom-input");let itemName="";if(select&&select.value==="custom"){itemName=customInput?customInput.value.trim():""}else if(select){itemName=select.value}else if(customInput){itemName=customInput.value.trim()}return{name:itemName,days:Math.max(1,Math.min(3650,Number(row.querySelector(".item-days-input")?.value)||7)),signal:!!row.querySelector(".item-signal-input")?.checked}});return{server,name:newName,items}}
function syncCardToWorkingData(card){const data=readServerCard(card);if(!data)return;const{server,name,items}=data;const serverRenamed=server.name!==name;server.name=name;items.forEach((entry,index)=>{const item=server.items[index];if(!item)return;if(item.name!==entry.name){item.name=entry.name;item.history=[];item.lastCleanedAt=null}item.days=entry.days;item.signal=entry.signal});if(serverRenamed){server.items.forEach(item=>{item.history=[];item.lastCleanedAt=null})}}
function bindSetupInputCommitHandlers(){document.querySelectorAll(".server-form-card .server-name-input, .server-form-card .item-custom-input, .server-form-card .item-days-input").forEach(input=>{input.removeEventListener("input",handleInputChange);input.addEventListener("input",handleInputChange)});document.querySelectorAll(".server-form-card .item-select-box, .server-form-card .item-signal-input").forEach(select=>{select.removeEventListener("change",handleInputChange);select.addEventListener("change",handleInputChange)})}
function handleInputChange(e){const card=e.target.closest(".server-form-card");if(card)markCardDirtyFromDom(card)}
function meaningfulCardState(card){const data=readServerCard(card);if(!data)return null;return{name:data.name,items:data.items.map(x=>({name:x.name,days:x.days,signal:x.signal}))}}
function markCardDirtyFromDom(card){if(!card)return;syncCardToWorkingData(card);const id=card.dataset.serverId;const current=meaningfulCardState(card);const snapshot=setupSnapshots.get(id);const isDirty=!snapshot||JSON.stringify(current)!==JSON.stringify({name:snapshot.name,items:snapshot.items.map(x=>({name:x.name,days:x.days,signal:x.signal}))});card.classList.toggle("is-dirty",isDirty);const saveBtn=card.querySelector(".server-save-button");if(saveBtn)saveBtn.disabled=!isDirty;if(isDirty)setupErrors.delete(id);updateProblemMarker(card)}

function itemNameEditorHtml(item){const defaultOptions=["スポンジ通し","フィルター洗浄","カラン洗浄"];const isCustom=item.name&&!defaultOptions.includes(item.name);const selectedValue=isCustom?"custom":(item.name||"スポンジ通し");return'<div class="item-name-editor"><select class="item-select-box" onchange="handleItemSelectChange(this)"><option value="スポンジ通し" '+(selectedValue==="スポンジ通し"?"selected":"")+'>スポンジ通し</option><option value="フィルター洗浄" '+(selectedValue==="フィルター洗浄"?"selected":"")+'>フィルター洗浄</option><option value="カラン洗浄" '+(selectedValue==="カラン洗浄"?"selected":"")+'>カラン洗浄</option><option value="custom" '+(isCustom?"selected":"")+'>直接入力（その他）</option></select><input class="item-custom-input" type="text" value="'+(isCustom?escAttr(item.name):"")+'" placeholder="項目名を入力" style="display:'+(isCustom?"block":"none")+';"></div>'}

function renderServerEditors(type){const container=document.getElementById(type==="beer"?"beerServers":"sourServers");if(!container)return;container.innerHTML="";const typeServers=appData.servers.filter(server=>server.type===type);typeServers.forEach((server,serverIndex)=>{const card=document.createElement("div");card.className="server-form-card";card.dataset.serverId=server.id;if(!setupNewCards.has(server.id))setupSnapshots.set(server.id,serverSnapshot(server));const itemHtml=server.items.map((item,index)=>{if(index<2)return itemConfigHtml(item,"標準項目 "+(index+1),false);return'<div class="optional-item-box"><div class="optional-item-head"><label>任意項目</label><button class="danger-button item-delete-button" type="button">削除</button></div>'+itemConfigHtml(item,"",true)+"</div>"}).join("");const placeholder=serverNamePlaceholder(type);card.innerHTML='<div class="problem-marker" aria-hidden="true">!</div><div class="server-form-head"><div class="field"><label>サーバー名</label><input class="server-name-input" type="text" value="'+escAttr(server.name)+'" placeholder="'+escAttr(placeholder)+'"></div>'+(serverIndex>0?'<button class="danger-button server-delete" type="button">削除</button>':"")+'</div><div class="server-items">'+itemHtml+"</div>"+(server.items.length<3?'<div class="add-button-wrap"><button class="add-button optional-add-button" type="button">＋ 項目を追加</button></div>':"")+'<div class="server-local-actions"><button class="secondary-button server-cancel-button" type="button">キャンセル</button><button class="primary-button server-save-button" type="button" disabled>保存</button></div>';container.appendChild(card);card.querySelector(".server-delete")?.addEventListener("click",()=>deleteServer(server.id,type));card.querySelector(".optional-add-button")?.addEventListener("click",()=>addOptional(server.id,type));card.querySelector(".item-delete-button")?.addEventListener("click",()=>deleteOptional(server.id,type));card.querySelector(".server-save-button")?.addEventListener("click",()=>saveServerCard(server.id,type));card.querySelector(".server-cancel-button")?.addEventListener("click",()=>cancelServerCard(server.id,type))});bindSetupInputCommitHandlers()}
function itemConfigHtml(item,label,optional){return'<div class="field item-field">'+(label?"<label>"+label+"</label>":"")+'<div class="item-config">'+itemNameEditorHtml(item)+'<input class="item-days-input" type="number" min="1" max="3650" value="'+(Number(item.days)||7)+'" title="締切日数"><label class="item-signal-label"><input class="item-signal-input" type="checkbox" '+(item.signal?"checked":"")+"> 締切日強調</label></div></div>"}
function addServer(type){discardEmptyNewCards(type);const server=createServer(type,"");appData.servers.push(server);setupNewCards.add(server.id);renderServerEditors(type);const newCard=document.querySelector('[data-server-id="'+CSS.escape(server.id)+'"]');if(newCard){markCardDirtyFromDom(newCard);newCard.querySelector(".server-name-input")?.focus()}}

function deleteOptional(serverId,type){const server=appData.servers.find(x=>x.id===serverId);if(!server||server.items.length!==3)return;if(!window.confirm("3つ目の任意項目を削除しますか？\nこの項目の履歴も削除されます。"))return;server.items.splice(2,1);renderServerEditors(type);const card=document.querySelector('[data-server-id="'+CSS.escape(serverId)+'"]');if(card)markCardDirtyFromDom(card)}
function deleteServer(serverId,type){const count=appData.servers.filter(x=>x.type===type).length;if(count<=1){showToast("ビールとサワーは、それぞれ1台以上必要です。");return}if(!window.confirm("このサーバーを削除しますか？\nこのサーバーに紐づく履歴も削除されます。"))return;appData.servers=appData.servers.filter(x=>x.id!==serverId);setupSnapshots.delete(serverId);setupNewCards.delete(serverId);setupErrors.delete(serverId);renderServerEditors(type)}
function saveServerCard(serverId,type){const card=document.querySelector('[data-server-id="'+CSS.escape(serverId)+'"]');if(!card)return;syncCardToWorkingData(card);const data=readServerCard(card);if(!data)return;let error="";if(!data.name)error="サーバー名を入力してください。";else{const names=appData.servers.filter(s=>s.id!==serverId).map(s=>s.name.trim());if(names.includes(data.name))error="他のサーバーと重複しない名前を付けてください。";const badItem=data.items.findIndex(x=>!x.name);if(badItem>=0){error="項目名を入力してください。"}else{const itemNames=data.items.map(x=>x.name.trim());const hasDuplicate=itemNames.some((name,idx)=>itemNames.indexOf(name)!==idx);if(hasDuplicate)error="項目が重複しています"}}if(error){setupErrors.add(serverId);updateProblemMarker(card);alert(error);return}setupErrors.delete(serverId);setupSnapshots.set(serverId,serverSnapshot(data.server));setupNewCards.delete(serverId);card.classList.remove("is-dirty");card.querySelector(".server-save-button").disabled=true;updateProblemMarker(card)}

function switchMode(mode){currentMode=mode;document.querySelectorAll(".tab").forEach(tab=>tab.classList.toggle("active",tab.dataset.mode===mode));renderCurrent()}
function setMainActions(kind){const row=document.getElementById("mainActions");if(kind==="m2"){row.innerHTML='<button class="primary-button" type="button" id="saveButton">保存</button><button class="secondary-button" type="button" id="cancelButton">キャンセル</button>';document.getElementById("saveButton").onclick=saveSelected;document.getElementById("cancelButton").onclick=()=>renderM2()}else{row.innerHTML='<button class="primary-button" type="button" id="saveButton">保存</button><button class="secondary-button" type="button" id="clearButton">選択クリヤー</button>';document.getElementById("saveButton").onclick=saveSelected;document.getElementById("clearButton").onclick=clearSelection}}
function renderCurrent(){if(currentMode==="M1")renderM1();else if(currentMode==="M2")renderM2();else renderM3()}
function deadlineFor(item){if(!item.lastCleanedAt)return null;const base=new Date(item.lastCleanedAt);base.setHours(0,0,0,0);base.setDate(base.getDate()+Number(item.days));return base}
function signalFor(item){if(!item.lastCleanedAt)return"white";if(!item.signal)return"white";const deadline=deadlineFor(item);const today=new Date();today.setHours(0,0,0,0);const diff=Math.round((deadline-today)/86400000);if(diff<=0)return"red";if(diff<=2)return"yellow";return"white"}
function deadlineBadgeHtml(item){const state=signalFor(item)||"white";return'<span class="deadline-badge badge-'+state+'">締切日</span>'}
function deadlineText(item){const d=deadlineFor(item);if(!d)return"未設定";return(d.getMonth()+1)+"/"+d.getDate()}
function renderM1(){setMainActions("normal");const content=document.getElementById("content");const beer=sortServers(appData.servers.filter(s=>s.type==="beer"));const sour=sortServers(appData.servers.filter(s=>s.type==="sour"));content.innerHTML=sectionHtml("ビール",beer)+sectionHtml("サワー",sour)}
function sectionHtml(title,servers){return'<div class="section-title">'+title+"</div>"+servers.map(serverCardHtml).join("")}
function serverCardHtml(server){return'<article class="server-card '+server.type+'"><div class="server-card-head"><div class="server-name">'+esc(server.name)+'</div></div><div class="item-list">'+server.items.map(item=>itemRowHtml(server,item)).join("")+"</div></article>"}
function itemRowHtml(server,item){return'<div class="item-row"><div class="item-label"><label><input type="checkbox" data-server-id="'+escAttr(server.id)+'" data-item-id="'+escAttr(item.id)+'"><span class="item-name">'+esc(item.name)+'</span></label></div><div class="deadline-grid"><div class="deadline-badge-cell">'+deadlineBadgeHtml(item)+'</div><div class="deadline-date-cell">'+deadlineText(item)+'</div></div></div>'}
function sortServers(servers){return[...servers].sort((a,b)=>priority(a)-priority(b))}
function priority(server){let best=Number.MAX_SAFE_INTEGER;for(const item of server.items){const d=deadlineFor(item);if(d)best=Math.min(best,d.getTime())}return best}
function renderM2(){setMainActions("m2");const content=document.getElementById("content");const items=[...new Set(appData.servers.flatMap(server=>server.items.map(item=>item.name).filter(Boolean)))];content.innerHTML='<div class="entry-screen m2-screen"><h2 class="entry-title">項目を選ぶ</h2><p class="entry-description">入力する項目を1つ選ぶと、対象となるサーバーが下に表示されます。</p><div class="m2-item-choices>'+items.map((name,index)=>'<label class="choice m2-item-choice"><input type="radio" name="m2item" class="m2item" data-name="'+escAttr(name)+'"><span>'+esc(name)+'</span></label>').join("")+'</div><div id="m2Servers" class="m2-servers"></div></div>';document.querySelectorAll(".m2item").forEach(radio=>{radio.addEventListener("change",()=>renderM2Servers(radio.dataset.name))})}
function renderM2Servers(itemName){const target=document.getElementById("m2Servers");if(!target)return;const servers=appData.servers.filter(server=>server.items.some(item=>item.name===itemName)).sort((a,b)=>{const typeOrder={beer:0,sour:1};return(typeOrder[a.type]-typeOrder[b.type])||(appData.servers.indexOf(a)-appData.servers.indexOf(b))});target.innerHTML='<h3 class="selected-item-title">'+esc(itemName)+'</h3><p class="entry-description">対象サーバーを選択してください。</p><div class="m2-server-list">'+servers.map(server=>{const item=server.items.find(x=>x.name===itemName);return'<label class="m2-server-tile '+server.type+'"><input type="checkbox" class="m2server" data-server-id="'+escAttr(server.id)+'" data-item-id="'+escAttr(item.id)+'"><span class="m2-server-name">'+esc(server.name)+'</span><div class="deadline-grid"><div class="deadline-badge-cell">'+deadlineBadgeHtml(item)+'</div><div class="deadline-date-cell">'+deadlineText(item)+'</div></div></label>'}).join("")+"</div>"}
function renderM3(){setMainActions("normal");const content=document.getElementById("content");const beer=appData.servers.filter(s=>s.type==="beer");const sour=appData.servers.filter(s=>s.type==="sour");content.innerHTML=sectionHtml("ビール",beer)+sectionHtml("サワー",sour)}
function saveSelected(){const checks=[...document.querySelectorAll("input[type=checkbox][data-server-id][data-item-id]:checked")];if(!checks.length){alert("保存する項目を選択してください。");return}showConfirm(checks.length+"件保存しますか？").then(ok=>{if(!ok)return;const now=new Date().toISOString();checks.forEach(check=>{const server=appData.servers.find(s=>s.id===check.dataset.serverId);const item=server?.items.find(i=>i.id===check.dataset.itemId);if(!item)return;item.lastCleanedAt=now;item.history=Array.isArray(item.history)?item.history:[];item.history.push(now)});appData.updatedAt=now;dbSet(STORAGE_KEY,appData);if(currentMode==="M1")renderM1();else if(currentMode==="M2")renderM2();else renderM3()})}
function clearSelection(){document.querySelectorAll("input[type=checkbox][data-server-id][data-item-id]").forEach(cb=>cb.checked=false)}

function openMenu(){
  if(document.querySelector(".menu-backdrop"))return;
  const backdrop=document.createElement("div");
  backdrop.className="menu-backdrop";
  backdrop.innerHTML='<aside class="menu-drawer" role="dialog" aria-label="メニュー"><h2>メニュー</h2><button class="menu-item" type="button" data-settings>設定</button><button class="menu-item" type="button" data-shop-name>特別メニュー：店名変更</button><button class="menu-item" type="button" data-export>データを含めてアプリを書き出し</button><button class="menu-item" type="button" data-manual>取扱説明書</button><button class="menu-item menu-item-danger" type="button" data-reset>すべて初期化</button><p class="menu-note">初期化すると店名、サーバー、項目、洗浄履歴をすべて削除します。</p></aside>';
  document.body.appendChild(backdrop);
  backdrop.addEventListener("click",e=>{if(e.target===backdrop)backdrop.remove()});
  backdrop.querySelector("[data-settings]").onclick=()=>{backdrop.remove();renderSetup(true,false)};
  backdrop.querySelector("[data-shop-name]").onclick=()=>{backdrop.remove();openShopNameChange()};
  backdrop.querySelector("[data-export]").onclick=()=>{backdrop.remove();exportSelf()};
  backdrop.querySelector("[data-manual]").onclick=()=>{backdrop.remove();showToast("取扱説明書は準備中です。")};
  backdrop.querySelector("[data-reset]").onclick=()=>{backdrop.remove();resetAppData()};
}

function exportSelf(){
  const data=dbGet(STORAGE_KEY);
  if(!data){alert("保存されているデータがありません。");return}
  const json=JSON.stringify(data);
  const html=document.documentElement.outerHTML;
  const replacement='const EMBEDDED_DATA='+JSON.stringify(json)+';';
  let out=html.replace(/const EMBEDDED_DATA=("[^"]*"|'[^']*'|"");/,replacement);
  if(out===html)out=html.replace("const EMBEDDED_DATA=\"\";",replacement);
  const shopName=(data.shopName||"サーバー管理アプリ").replace(/[\\/:*?"<>|]/g,"_");
  const d=new Date();
  const dateStr=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const fileName=shopName+"_サーバー管理アプリ_"+dateStr+".html";
  const blob=new Blob([out],{type:"text/html;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=fileName;document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast("アプリを書き出しました。");
}

function resetAppData(){
  showConfirm("店名、サーバー、項目、洗浄履歴をすべて削除して初期設定に戻します。","すべて初期化").then(ok=>{
    if(!ok)return;
    dbDelete(STORAGE_KEY);
    appData=createEmptyData();
    setupBackup=null;setupInitial=true;setupSnapshots=new Map();setupNewCards=new Set();setupErrors=new Set();
    updateHeader();renderSetup(false,true);
    showToast("すべて初期化しました。");
  });
}

function openShopNameChange(){
  const root=document.getElementById("modalRoot");
  root.innerHTML='<div class="modal-backdrop"><div class="modal shop-name-change-modal" role="dialog" aria-modal="true"><h2>店名変更</h2><p>店名と店舗バッジだけを変更します。登録済みのサーバー・項目・履歴はそのまま残ります。</p><div class="field"><label for="shopNameChangeInput">店名</label><input id="shopNameChangeInput" type="text" value="'+escAttr(appData.shopName)+'"></div>'+shopBadgePickerHtml(appData.shopName,appData.shopBadgeColor)+'<div class="modal-actions"><button class="secondary-button" type="button" data-cancel>キャンセル</button><button class="primary-button" type="button" data-save>保存</button></div></div></div>';
  bindShopBadgePicker(root);
  root.querySelector("[data-cancel]").onclick=()=>root.innerHTML="";
  root.querySelector("[data-save]").onclick=()=>{const value=root.querySelector("#shopNameChangeInput").value.trim();if(!value){alert("店名を入力してください。");return}const selectedBadge=root.querySelector(".shop-badge-option.selected")?.dataset.badgeColor||appData.shopBadgeColor||DEFAULT_SHOP_BADGE_COLOR;appData.shopName=value;appData.shopBadgeColor=selectedBadge;appData.updatedAt=new Date().toISOString();dbSet(STORAGE_KEY,appData);root.innerHTML="";updateHeader();renderMain();showToast("店名を変更しました。")};
}
function shopBadgePickerHtml(name,selectedColor){const selected=SHOP_BADGE_COLORS[selectedColor]?selectedColor:DEFAULT_SHOP_BADGE_COLOR;const safeName=name||"店舗名";return'<div class="shop-badge-picker"><div class="field"><label>店舗バッジ</label><p class="notice">店名を入力すると、下の10色に反映されます。使用する色を選択してください。</p></div><div class="shop-badge-options">'+Object.keys(SHOP_BADGE_COLORS).map(key=>'<button type="button" class="shop-badge-option store-name '+(selected===key?"selected":"")+" "+SHOP_BADGE_COLORS[key].className+'" data-badge-color="'+key+'" aria-label="'+SHOP_BADGE_NAMES[key]+'"><span class="store-name-text">'+esc(safeName)+'</span></button>').join("")+"</div></div>"}
function fitShopBadgeText(scope=document){const texts=[];if(scope instanceof Element&&scope.matches(".store-name-text")){texts.push(scope)}else if(scope instanceof Element||scope===document){texts.push(...scope.querySelectorAll(".store-name-text"))}texts.forEach(text=>{const box=text.parentElement;if(!box)return;text.style.fontSize="21px";text.style.lineHeight="1.05";const maxSize=21,minSize=10,step=0.5;const availableWidth=Math.max(1,box.clientWidth-4);const availableHeight=Math.max(1,box.clientHeight-2);let size=maxSize;while(size>minSize){text.style.fontSize=size+"px";text.style.lineHeight="1.05";if(text.scrollWidth<=availableWidth+1&&text.scrollHeight<=availableHeight+1)break;size-=step}text.style.fontSize=Math.max(minSize,size)+"px"})}
function bindShopBadgePicker(scope=document){const input=scope.querySelector("#shopName")||scope.querySelector("#shopNameChangeInput");const buttons=[...scope.querySelectorAll(".shop-badge-option")];if(!buttons.length)return;const refresh=()=>{const value=input?input.value:appData?.shopName||"";buttons.forEach(btn=>{const text=btn.querySelector(".store-name-text");if(text)text.textContent=value||"店舗名"});requestAnimationFrame(()=>fitShopBadgeText(scope))};buttons.forEach(btn=>{btn.onclick=()=>{buttons.forEach(x=>x.classList.remove("selected"));btn.classList.add("selected")}});if(input)input.addEventListener("input",refresh);refresh()}
function showConfirm(message,title="確認"){return new Promise(resolve=>{const root=document.getElementById("modalRoot");root.innerHTML='<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><h2>'+esc(title)+'</h2><p>'+esc(message)+'</p><div class="modal-actions"><button class="secondary-button" type="button" data-cancel>キャンセル</button><button class="primary-button" type="button" data-ok>OK</button></div></div></div>';root.querySelector("[data-cancel]").onclick=()=>{root.innerHTML="";resolve(false)};root.querySelector("[data-ok]").onclick=()=>{root.innerHTML="";resolve(true)}})}
function showToast(message){document.querySelector(".toast")?.remove();const toast=document.createElement("div");toast.className="toast";toast.textContent=message;document.body.appendChild(toast);setTimeout(()=>toast.remove(),2200)}
function esc(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function escAttr(value){return esc(value)}
</script>
