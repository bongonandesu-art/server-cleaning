<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#29434e">
<meta name="description" content="サーバー洗浄管理">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>サーバー洗浄管理</title>
<style>
*{box-sizing:border-box}
:root{
  --text:#263238;--muted:#66727a;--line:#d9dee1;--navy:#29434e;--blue-outline:#8fc7d8;
  --beer-card:#fff9df;--sour-card:#e9f8fc;--setup-card:#f3f5f6;
  --signal-yellow:#ffeb3b;--signal-red:#f44336;--button:#29434e;--button-text:#fff;--page:#fff;
  --header-height:calc(88px + env(safe-area-inset-top));
}
html,body{margin:0;padding:0;min-height:100%;background:var(--page);color:var(--text);
  font-family:"Zen Maru Gothic",-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{cursor:pointer}
.app-header{position:sticky;top:0;z-index:20;height:var(--header-height);padding-top:env(safe-area-inset-top);
  background:#fff;border-bottom:1px solid var(--line);display:grid;grid-template-columns:54px minmax(0,1fr) 116px;align-items:center}
.header-left{min-width:0;height:100%;display:flex;align-items:center;justify-content:flex-start}
.header-menu{width:54px;height:100%;border:0;background:transparent;color:var(--navy);font-size:23px}
.header-menu:hover{background:#f5f7f8}
.header-center{min-width:0;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
.title-block{min-width:0;max-width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.title-main{display:flex;align-items:center;justify-content:center;min-width:0;max-width:100%;height:42px}
.beer-emoji{flex:0 0 auto;font-size:42px;line-height:1;user-select:none;opacity:.85;margin-right:-18px;pointer-events:none}
.app-title-text{position:relative;z-index:1;min-width:0;max-width:100%;margin:0;padding:0 2px;
  font-size:clamp(21px,3.2vw,28px);font-weight:700;letter-spacing:.04em;white-space:nowrap;color:var(--text);
  font-family:"Zen Maru Gothic",sans-serif;text-shadow:-.6px -.6px 0 var(--blue-outline),.6px -.6px 0 var(--blue-outline),-.6px .6px 0 var(--blue-outline),.6px .6px 0 var(--blue-outline)}
.app-title-version{display:block;margin-top:-1px;font-size:11px;font-weight:700;letter-spacing:.03em;white-space:nowrap;color:var(--navy)}
.header-right{min-width:0;height:100%;display:flex;align-items:center;justify-content:flex-end;padding-right:8px}
.store-name,.shop-badge-option{width:116px;height:52px;padding:1px 2px;display:flex;align-items:center;justify-content:center;
  text-align:center;border-radius:6px;border:1px solid transparent;box-shadow:0 2px 5px rgba(0,0,0,.08);position:relative;overflow:hidden}
.store-name-text{display:-webkit-box;width:100%;max-width:100%;font-size:21px;line-height:1.05;font-weight:700;
  overflow:hidden;overflow-wrap:anywhere;word-break:break-word;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.shop-badge-01{background:#8B4513;color:#fff;border-color:transparent}
.shop-badge-02{background:#FFFF00;color:#000;border-color:#000}
.shop-badge-03{background:#f59e0b;color:#1e293b;border-color:transparent}
.shop-badge-04{background:#F5F5DC;color:#000;border-color:#000}
.shop-badge-05{background:#9ACD32;color:#000;border-color:transparent}
.shop-badge-06{background:#3b82f6;color:#fff;border-color:transparent}
.shop-badge-07{background:#008080;color:#fff;border-color:transparent}
.shop-badge-08{background:#8b5cf6;color:#fff;border-color:transparent}
.shop-badge-09{background:#ec4899;color:#fff;border-color:transparent}
.shop-badge-10{background:#6b7280;color:#fff;border-color:transparent}
.shop-badge-picker{margin-top:4px}
.shop-badge-options{display:flex;flex-wrap:wrap;gap:14px;padding:8px 0 4px}
.shop-badge-option{flex:0 0 auto}
.shop-badge-option.selected{outline:3px solid var(--navy);outline-offset:2px}
.shop-badge-option.shop-badge-02{border-color:#000}
.shop-badge-option.shop-badge-04{border-color:#000}
.app-main{width:min(760px,100%);margin:0 auto}
.fixed-controls{position:sticky;top:var(--header-height);z-index:15;background:rgba(255,255,255,.97);
  border-bottom:1px solid var(--line);box-shadow:0 2px 7px rgba(0,0,0,.05)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr)}
.tab{min-height:48px;border:0;border-right:1px solid var(--line);background:#f5f7f8;color:#4b5960;font-weight:700;font-size:14px}
.tab:last-child{border-right:0}
.tab.active{background:#fff;color:var(--navy);box-shadow:inset 0 -3px 0 var(--navy)}
.action-row{display:flex;gap:10px;padding:10px 12px}
.action-row button{flex:1;min-height:46px;border-radius:8px;border:1px solid var(--navy);font-weight:700}
.primary-button{background:var(--button);color:var(--button-text)}
.secondary-button{background:#fff;color:var(--navy)}
.page{padding:18px 12px 48px}
.section-title{text-align:center;margin:16px 0 12px;color:var(--navy);font-size:15px;font-weight:800;letter-spacing:.08em}
.section-title::before,.section-title::after{content:"";display:inline-block;width:28%;max-width:150px;vertical-align:middle;border-top:1px solid #aeb9be;margin:0 10px}
.server-card{border:1px solid rgba(38,50,56,.14);border-radius:10px;padding:13px 14px 10px;margin-bottom:12px;will-change:transform}
.server-card.beer{background:var(--beer-card)}
.server-card.sour{background:var(--sour-card)}
.server-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.server-name{font-size:18px;font-weight:800;overflow-wrap:anywhere}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;min-height:64px;border-top:1px solid rgba(38,50,56,.10);padding:6px 0;will-change:transform}
.item-label label{display:flex;align-items:center;gap:8px;min-width:0;width:100%}
.item-label input[type=checkbox]{width:23px;height:23px;flex:0 0 auto}
.item-name{overflow-wrap:anywhere}
.deadline-grid{display:grid;grid-template-columns:36px 50px;align-items:center;justify-items:center;gap:6px}
.deadline-badge-cell{display:flex;align-items:center;justify-content:center;width:100%}
.deadline-date-cell{width:100%;text-align:left;font-weight:700;font-size:16px;white-space:nowrap}
.deadline-badge{display:flex;align-items:center;justify-content:center;width:32px;height:58px;border-radius:50%/25%;
  border:1px solid #29434e;writing-mode:vertical-rl;text-orient:upright;line-height:1;letter-spacing:1px;box-sizing:border-box;flex:0 0 auto}
.badge-white{background-color:#fff;color:#29434e;font-size:13px;font-weight:400}
.badge-yellow{background-color:#ffeb3b;color:#29434e;font-size:14px;font-weight:700}
.badge-red{background-color:#f44336;color:#fff;font-size:14px;font-weight:700}
.setup-wrap{padding:22px 16px 90px}
.setup-wrap h1{text-align:center;font-size:24px;margin:10px 0 26px}
.setup-intro{margin:-8px 0 20px;color:var(--muted);font-size:13px;line-height:1.7}
.form-card{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;background:#fff}
.form-card h2{font-size:18px;margin:0 0 14px;color:var(--navy)}
.shop-form-card{background:#fff}
.notice{margin:0 0 12px;color:var(--muted);font-size:12px;line-height:1.6}
.registered-shop-name{min-height:44px;padding:10px;border:1px solid #d9dee1;border-radius:7px;background:#f7f9fa}
.field{margin-bottom:14px}
.field>label{display:block;font-weight:700;margin-bottom:6px}
input[type=text],input[type=number]{width:100%;min-height:44px;border:1px solid #b9c3c7;border-radius:7px;padding:8px 10px;background:#fff}
#beerServers,#sourServers{display:flex;flex-direction:column;gap:12px}
.server-form-card{position:relative;border:1px solid #d2d8db;border-radius:10px;padding:14px 14px 12px;background:var(--setup-card);margin:0}
.server-form-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.server-form-head .field{margin-bottom:0}
.server-delete{min-height:44px;padding:8px 14px}
.problem-marker{position:absolute;left:-8px;top:18px;width:22px;height:22px;border-radius:50%;background:#f44336;color:#fff;font-weight:900;font-size:14px;line-height:22px;text-align:center;display:none;z-index:3}
.problem-marker.visible{display:block}
.server-items{margin-top:12px}
.item-config{display:grid;grid-template-columns:minmax(0,1fr) 100px auto;gap:8px;align-items:center;margin-bottom:8px}
.item-name-editor{display:flex;flex-direction:column;gap:6px;width:100%}
.item-select-box{width:100%;min-height:44px;border:1px solid #b9c3c7;border-radius:7px;padding:0 10px;background:#fff;font-size:14px}
.item-custom-input{width:100%;min-height:44px;border:1px solid #b9c3c7;border-radius:7px;padding:8px 10px;background:#fff}
.add-button-wrap{margin-top:20px;display:flex;justify-content:flex-start}
.add-button{min-height:42px;padding:7px 16px;border:1px solid var(--navy);border-radius:7px;background:#fff;color:var(--navy);width:auto;display:inline-block}
.server-form-card .add-button-wrap{margin-top:12px}
.item-field{margin-bottom:10px}
.item-signal-label{display:flex;align-items:center;gap:4px;white-space:nowrap;color:var(--text);font-size:12px}
.item-signal-label input{width:18px;height:18px}
.optional-item-box{margin-top:10px;padding-top:12px;border-top:1px solid #d5dade}
.optional-item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:7px}
.optional-item-head label{font-weight:700}
.danger-button{border:1px solid #d00012!important;color:#d00012!important;background:#fff;border-radius:7px}
.server-local-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.server-local-actions button{min-width:88px;min-height:40px;border-radius:7px;border:1px solid var(--navy);font-weight:700}
.server-local-actions .server-save-button:disabled{background:#b9c1c5;color:#fff;border-color:#b9c1c5;cursor:default}
.server-form-card.is-dirty{box-shadow:0 0 0 1px rgba(41,67,78,.08)}
.setup-finish-bar{position:sticky;bottom:0;z-index:10;margin:16px -16px -90px;padding:10px 16px;background:rgba(255,255,255,.96);border-top:1px solid var(--line)}
.setup-finish-bar button{width:100%;min-height:50px;border:0;border-radius:8px;background:var(--button);color:#fff;font-weight:800}
.entry-screen{padding:12px 0 48px}
.entry-title{text-align:center;color:var(--navy);font-size:21px;margin:8px 0}
.entry-description{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 14px}
.choice-list{display:flex;flex-direction:column;gap:8px}
.choice{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;min-height:50px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}
.choice input{width:22px;height:22px}
.m2-item-choices{display:flex;flex-direction:column;gap:8px}
.m2-item-choice{grid-template-columns:auto minmax(0,1fr)}
.m2-servers{margin-top:22px}
.selected-item-title{font-size:18px;color:var(--navy);margin:0 0 4px}
.m2-server-list{display:flex;flex-direction:column;gap:10px}
.m2-server-tile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;min-height:64px;padding:10px 12px;border-radius:10px;border:1px solid rgba(38,50,56,.14);will-change:transform}
.m2-server-tile.beer{background:var(--beer-card)}
.m2-server-tile.sour{background:var(--sour-card)}
.m2-server-tile input{width:23px;height:23px}
.m2-server-name{font-weight:800;overflow-wrap:anywhere}
.menu-backdrop,.modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.42)}
.menu-backdrop{display:flex}
.menu-drawer{width:min(360px,88vw);height:100%;overflow-y:auto;background:#fff;padding:24px 18px;box-shadow:8px 0 30px rgba(0,0,0,.18);will-change:transform}
.menu-drawer h2{margin:0 0 10px;color:var(--navy)}
.page-scale-row{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin:0 0 16px;color:var(--muted);font-size:13px;white-space:nowrap}
.page-scale-row button{min-width:34px;height:32px;border:1px solid var(--line);border-radius:6px;background:#f7f9fa;color:var(--navy);font-size:20px;line-height:1}
.page-scale-value{min-width:42px;text-align:center;color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.menu-item{display:block;width:100%;text-align:left;min-height:48px;border:0;border-bottom:1px solid var(--line);background:#fff;color:var(--text);font-weight:700}
.menu-item-danger{color:#b42318} .menu-item-generator{color:#2e7d32}
.menu-note{font-size:12px;color:var(--muted);line-height:1.6}.menu-generator-spacer{height:16px}
.modal-backdrop{display:flex;align-items:center;justify-content:center;padding:20px}
.modal{width:min(420px,100%);background:#fff;border-radius:12px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.22)}
.modal h2{margin:0 0 10px;font-size:19px}
.modal p{line-height:1.6;margin:0 0 18px}
.modal-actions{display:flex;gap:10px}
.modal-actions button{flex:1;min-height:46px;border-radius:8px;font-weight:700}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;background:#263238;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 5px 20px rgba(0,0,0,.2)}
@media(max-width:480px){
  .item-config{grid-template-columns:1fr 78px auto}
  .item-signal-label{font-size:11px}
  .section-title::before,.section-title::after{width:20%}
  .app-header{grid-template-columns:48px minmax(0,1fr) 104px}
  .header-menu{width:48px}
  .header-right{padding-right:4px}
  .store-name,.shop-badge-option{width:104px;height:50px;padding:1px 2px}
  .store-name{flex-basis:104px}
  .store-name-text{font-size:21px}
  .app-title-text{font-size:clamp(19px,6.2vw,23px);letter-spacing:.02em}
  .beer-emoji{font-size:34px;margin-right:-15px}
  .app-title-version{font-size:10px}
}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-left"><button id="menuButton" class="header-menu" type="button" aria-label="メニューを開く">☰</button></div>
  <div class="header-center"><div class="title-block"><div class="title-main"><span class="beer-emoji">🍺</span><h1 class="app-title-text">サーバー洗浄管理</h1></div><span class="app-title-version">v0.6.1</span></div></div>
  <div class="header-right"><div id="storeNameHeader" class="store-name"><span class="store-name-text"></span></div></div>
</header>
<main id="app" class="app-main"></main>
<div id="modalRoot"></div>
<script>
const APP_VERSION="v0.6.1";
const STORAGE_KEY="server-cleaning-appData";
const REVISION_KEY=STORAGE_KEY+"-revision";
const WORKING_KEY=STORAGE_KEY+"-working-selection";
const EMBEDDED_DATA="";
const PAGE_SCALE_KEY="server-cleaning-app-page-scale";
let pageScale=100;
try{const storedScale=Number(localStorage.getItem(PAGE_SCALE_KEY));if(Number.isFinite(storedScale)&&storedScale>=50&&storedScale<=150)pageScale=storedScale}catch(e){}
function applyPageScale(){document.documentElement.style.zoom=(pageScale/100);const value=document.getElementById("pageScaleValue");if(value)value.textContent=pageScale+"%"}
function changePageScale(delta){pageScale=Math.max(50,Math.min(150,pageScale+delta));try{localStorage.setItem(PAGE_SCALE_KEY,String(pageScale))}catch(e){}applyPageScale()}
applyPageScale();
const DEFAULT_SHOP_BADGE_COLOR="10";
const SHOP_BADGE_COLORS={"01":{bg:"#8B4513",color:"#fff",border:"transparent",className:"shop-badge-01"},"02":{bg:"#FFFF00",color:"#000",border:"#000",className:"shop-badge-02"},"03":{bg:"#f59e0b",color:"#1e293b",border:"transparent",className:"shop-badge-03"},"04":{bg:"#F5F5DC",color:"#000",border:"#000",className:"shop-badge-04"},"05":{bg:"#9ACD32",color:"#000",border:"transparent",className:"shop-badge-05"},"06":{bg:"#3b82f6",color:"#fff",border:"transparent",className:"shop-badge-06"},"07":{bg:"#008080",color:"#fff",border:"transparent",className:"shop-badge-07"},"08":{bg:"#8b5cf6",color:"#fff",border:"transparent",className:"shop-badge-08"},"09":{bg:"#ec4899",color:"#fff",border:"transparent",className:"shop-badge-09"},"10":{bg:"#6b7280",color:"#fff",border:"transparent",className:"shop-badge-10"}};
const SHOP_BADGE_NAMES={"01":"サドルブラウン","02":"イエロー","03":"アンバー","04":"ベージュ","05":"イエローグリーン","06":"ブルー","07":"ティール/藍緑","08":"パープル","09":"ピンク","10":"グレー"};
const DEFAULT_ITEMS={beer:[{name:"スポンジ通し",days:7,signal:true},{name:"フィルター洗浄",days:14,signal:true}],sour:[{name:"カラン洗浄",days:7,signal:true},{name:"フィルター洗浄",days:14,signal:true}]};
let appData=null,currentMode="M1",setupBackup=null,setupInitial=false,setupSnapshots=new Map(),setupNewCards=new Set(),setupErrors=new Set(),staleDialogOpen=false;

function dbGet(key){try{return JSON.parse(localStorage.getItem(key))}catch(e){return null}}
function dbSet(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){console.warn("localStorage save failed",e)}}
function dbDelete(key){try{localStorage.removeItem(key)}catch(e){}}
function revisionGet(){try{return Number(localStorage.getItem(REVISION_KEY))||0}catch(e){return 0}}
function revisionSet(value){try{localStorage.setItem(REVISION_KEY,String(value))}catch(e){console.warn("revision save failed",e)}}
function revisionNext(){const next=revisionGet()+1;revisionSet(next);return next}
function saveAppData(){appData.updatedAt=new Date().toISOString();appData.revision=revisionNext();dbSet(STORAGE_KEY,appData);return appData.revision}
function workingGet(){try{return JSON.parse(sessionStorage.getItem(WORKING_KEY))}catch(e){return null}}
function workingSet(value){try{if(value&&Array.isArray(value.checks)&&value.checks.length){sessionStorage.setItem(WORKING_KEY,JSON.stringify(value))}else{sessionStorage.removeItem(WORKING_KEY)}}catch(e){console.warn("working selection save failed",e)}}
function workingClear(){try{sessionStorage.removeItem(WORKING_KEY)}catch(e){}}
function checkedPairs(){return [...document.querySelectorAll("input[type=checkbox][data-server-id][data-item-id]:checked")].map(cb=>({serverId:cb.dataset.serverId,itemId:cb.dataset.itemId}))}
function captureWorkingSelection(){const checks=checkedPairs();const previous=workingGet();if(!checks.length){workingClear();return null}const first=checks[0];let itemName=previous?.itemName||"";const firstServer=appData.servers.find(s=>s.id===first.serverId);const firstItem=firstServer?.items.find(i=>i.id===first.itemId);if(firstItem)itemName=firstItem.name;workingSet({mode:currentMode,itemName,checks,at:new Date().toISOString()});return workingGet()}
function restoreWorkingSelection(){const work=workingGet();if(!work||!Array.isArray(work.checks)||!work.checks.length)return;const valid=work.checks.filter(pair=>appData.servers.some(s=>s.id===pair.serverId&&s.items.some(i=>i.id===pair.itemId)));if(!valid.length){workingClear();return}if(currentMode==="M2"&&work.itemName){const radio=[...document.querySelectorAll(".m2item")].find(r=>r.dataset.name===work.itemName);if(radio){radio.checked=true;renderM2Servers(work.itemName);}}document.querySelectorAll("input[type=checkbox][data-server-id][data-item-id]").forEach(cb=>{cb.checked=valid.some(pair=>pair.serverId===cb.dataset.serverId&&pair.itemId===cb.dataset.itemId)});workingSet({...work,checks:valid})}
function ensureFreshBeforeSave(){const current=revisionGet();const pageRevision=Number(appData?.revision)||0;if(current!==pageRevision){showStalePageDialog(current);return false}return true}
function checkForStalePage(){if(!appData||staleDialogOpen)return;const current=revisionGet();const pageRevision=Number(appData.revision)||0;if(current&&current!==pageRevision)showStalePageDialog(current)}
function showStalePageDialog(currentRevision){if(staleDialogOpen)return;staleDialogOpen=true;const root=document.getElementById("modalRoot");const latest=readLatestSavedData();const updated=latest?.updatedAt?formatRelativeSavedTime(latest.updatedAt):"";root.innerHTML='<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><h2>古いページを見ています。</h2><p>別のタブで更新されています。<br>最新の保存は'+esc(updated||"以前")+'です。</p><div class="modal-actions"><button class="secondary-button" type="button" data-close>このページを閉じる</button><button class="primary-button" type="button" data-latest>最新にする</button></div></div></div>';root.querySelector("[data-close]").onclick=()=>{staleDialogOpen=false;closeCurrentPage()};root.querySelector("[data-latest]").onclick=()=>{staleDialogOpen=false;root.innerHTML="";const latestData=readLatestSavedData();if(!latestData)return;appData=latestData;normalizeData();updateHeader();currentMode="M1";renderMain();restoreWorkingSelection();showToast("最新の状態に更新しました。")} }
function readLatestSavedData(){const latest=dbGet(STORAGE_KEY);if(!latest||!Array.isArray(latest.servers))return null;return latest}
function formatRelativeSavedTime(iso){const time=new Date(iso).getTime();if(!Number.isFinite(time))return"以前";const diff=Math.max(0,Date.now()-time);const minutes=Math.floor(diff/60000);if(minutes<1)return"1分未満前";if(minutes<60)return minutes+"分前";const hours=Math.floor(minutes/60);if(hours<24)return hours+"時間"+(minutes%60?minutes%60+"分":"")+"前";const days=Math.floor(hours/24);return days+"日前"}
function closeCurrentPage(){try{window.close()}catch(e){}setTimeout(()=>{if(!document.hidden)location.href="about:blank"},100)}

function init(){
  document.getElementById("menuButton").addEventListener("click",openMenu);
  let restored=false;
  if(EMBEDDED_DATA){
    try{
      const embedded=JSON.parse(EMBEDDED_DATA);
      if(embedded&&embedded.servers){
        const existing=dbGet(STORAGE_KEY);
        if(!existing){
          appData=embedded;appData.revision=revisionNext();dbSet(STORAGE_KEY,appData);
          restored=true;
        }
      }
    }catch(e){console.warn("EMBEDDED_DATA parse failed",e)}
  }
  appData=dbGet(STORAGE_KEY);
  if(!appData){appData=createEmptyData();setupInitial=true;renderSetup(false,true);return}
  normalizeData();if(!appData.revision){appData.revision=revisionGet();if(!appData.revision){appData.revision=revisionNext();dbSet(STORAGE_KEY,appData)}}else if(revisionGet()!==Number(appData.revision)){revisionSet(Number(appData.revision))}updateHeader();currentMode="M1";renderMain();restoreWorkingSelection();
  if(restored)showToast("データを読み込みました");
}

function createEmptyData(){return{version:2,shopName:"",shopBadgeColor:DEFAULT_SHOP_BADGE_COLOR,servers:[createServer("beer","ビールサーバー1"),createServer("sour","A1")],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}}
function createServer(type,name=""){return{id:crypto.randomUUID(),type,name,items:DEFAULT_ITEMS[type].map(item=>createItem(item))}}
function createItem(source){return{id:crypto.randomUUID(),name:source.name||"",days:Math.max(1,Number(source.days)||7),signal:source.signal!==false,history:Array.isArray(source.history)?[...source.history]:[],lastCleanedAt:source.lastCleanedAt||null}}
function cloneItem(item){return{id:item.id,name:item.name,days:Math.max(1,Number(item.days)||7),signal:item.signal!==false,history:Array.isArray(item.history)?[...item.history]:[],lastCleanedAt:item.lastCleanedAt||null}}
function cloneServer(server){return{id:server.id,type:server.type,name:server.name,items:server.items.map(cloneItem)}}
function normalizeData(){if(!appData||!Array.isArray(appData.servers)){appData=createEmptyData();return}appData.shopName=appData.shopName||"";if(!SHOP_BADGE_COLORS[appData.shopBadgeColor])appData.shopBadgeColor=DEFAULT_SHOP_BADGE_COLOR;appData.servers.forEach(server=>{server.id=server.id||crypto.randomUUID();server.type=server.type==="sour"?"sour":"beer";server.name=server.name||"";server.items=Array.isArray(server.items)?server.items:[];server.items.forEach(item=>{item.id=item.id||crypto.randomUUID();item.name=item.name||"";item.days=Math.max(1,Number(item.days)||7);item.signal=item.signal!==false;item.history=Array.isArray(item.history)?item.history:[];item.lastCleanedAt=item.lastCleanedAt||null})})}
function updateHeader(){const element=document.getElementById("storeNameHeader");if(!element)return;const color=SHOP_BADGE_COLORS[appData?.shopBadgeColor]?appData.shopBadgeColor:DEFAULT_SHOP_BADGE_COLOR;const text=element.querySelector(".store-name-text");if(text)text.textContent=appData?.shopName||"";element.className="store-name "+SHOP_BADGE_COLORS[color].className;fitShopBadgeText(element)}

function renderSetup(edit,firstTime){
  setupInitial=firstTime;setupBackup=edit?JSON.parse(JSON.stringify(appData)):null;setupSnapshots=new Map();setupNewCards=new Set();setupErrors=new Set();
  const app=document.getElementById("app");const d=appData;
  app.innerHTML='<section class="setup-wrap"><h1>設定</h1>'+(firstTime?'<p class="setup-intro">店名や各サーバーを登録したのち、メインページに進みます。<br>左上の三本線を押すと、取説が確認できます。</p>':'')+'<div class="form-card shop-form-card"><h2>店舗</h2><div class="field"><label>'+(firstTime?"店名":"登録店名")+'</label>'+(firstTime?'<input id="shopName" type="text" value="'+escAttr(d.shopName)+'" placeholder="例：○○店">':'<div class="registered-shop-name">'+esc(d.shopName)+'</div>')+'</div>'+(firstTime?shopBadgePickerHtml(d.shopName,d.shopBadgeColor):'<p class="notice">店名の変更は、メニューの「特別メニュー：店名変更」から行います。</p>')+'</div><div class="form-card"><h2>ビールサーバー</h2><p class="notice">初期状態は1台・2項目です。サーバー名、締切日数、締切日強調は自由に設定できます。</p><div id="beerServers"></div><div class="add-button-wrap"><button class="add-button" type="button" onclick="addServer(\'beer\')">＋ ビールサーバーを追加</button></div></div><div class="form-card"><h2>サワーサーバー</h2><p class="notice">卓番号・卓名は自由入力し、入力した順番で表示します。</p><div id="sourServers"></div><div class="add-button-wrap"><button class="add-button" type="button" onclick="addServer(\'sour\')">＋ サワーサーバーを追加</button></div></div><div class="setup-finish-bar"><button type="button" onclick="finishSetup()">設定を完了しメインページに進む</button></div></section>';
  renderServerEditors("beer");renderServerEditors("sour");bindSetupInputCommitHandlers();bindShopBadgePicker();

function serverSnapshot(server){return JSON.parse(JSON.stringify(cloneServer(server)))}
function restoreServerSnapshot(serverId){const snapshot=setupSnapshots.get(serverId);if(!snapshot)return false;const index=appData.servers.findIndex(s=>s.id===serverId);if(index<0)return false;appData.servers[index]=JSON.parse(JSON.stringify(snapshot));return true}
function readServerCard(card){const server=appData.servers.find(x=>x.id===card.dataset.serverId);if(!server)return null;const nameInput=card.querySelector(".server-name-input");const newName=nameInput?nameInput.value.trim():server.name;const rows=[...card.querySelectorAll(".item-config")].slice(0,3);const items=rows.map((row)=>{const select=row.querySelector(".item-select-box");const customInput=row.querySelector(".item-custom-input");let itemName="";if(select&&select.value==="custom"){itemName=customInput?customInput.value.trim():""}else if(select){itemName=select.value}else if(customInput){itemName=customInput.value.trim()}return{name:itemName,days:Math.max(1,Math.min(3650,Number(row.querySelector(".item-days-input")?.value)||7)),signal:!!row.querySelector(".item-signal-input")?.checked}});return{server,name:newName,items}}
function syncCardToWorkingData(card){const data=readServerCard(card);if(!data)return;const{server,name,items}=data;const serverRenamed=server.name!==name;server.name=name;items.forEach((entry,index)=>{const item=server.items[index];if(!item)return;if(item.name!==entry.name){item.name=entry.name;item.history=[];item.lastCleanedAt=null}item.days=entry.days;item.signal=entry.signal});if(serverRenamed){server.items.forEach(item=>{item.history=[];item.lastCleanedAt=null})}}
function bindSetupInputCommitHandlers(){document.querySelectorAll(".server-form-card .server-name-input, .server-form-card .item-custom-input, .server-form-card .item-days-input").forEach(input=>{input.removeEventListener("input",handleInputChange);input.addEventListener("input",handleInputChange)});document.querySelectorAll(".server-form-card .item-select-box, .server-form-card .item-signal-input").forEach(select=>{select.removeEventListener("change",handleInputChange);select.addEventListener("change",handleInputChange)})}
function handleInputChange(e){const card=e.target.closest(".server-form-card");if(card)markCardDirtyFromDom(card)}
function meaningfulCardState(card){const data=readServerCard(card);if(!data)return null;return{name:data.name,items:data.items.map(x=>({name:x.name,days:x.days,signal:x.signal}))}}
function markCardDirtyFromDom(card){if(!card)return;syncCardToWorkingData(card);const id=card.dataset.serverId;const current=meaningfulCardState(card);const snapshot=setupSnapshots.get(id);const isDirty=!snapshot||JSON.stringify(current)!==JSON.stringify({name:snapshot.name,items:snapshot.items.map(x=>({name:x.name,days:x.days,signal:x.signal}))});card.classList.toggle("is-dirty",isDirty);const saveBtn=card.querySelector(".server-save-button");if(saveBtn)saveBtn.disabled=!isDirty;if(isDirty)setupErrors.delete(id);updateProblemMarker(card)}
function updateProblemMarker(card){const marker=card.querySelector(".problem-marker");if(marker)marker.classList.toggle("visible",setupErrors.has(card.dataset.serverId))}
function itemNameEditorHtml(item){const defaultOptions=["スポンジ通し","フィルター洗浄","カラン洗浄"];const isCustom=item.name&&!defaultOptions.includes(item.name);const selectedValue=isCustom?"custom":(item.name||"スポンジ通し");return'<div class="item-name-editor"><select class="item-select-box" onchange="handleItemSelectChange(this)"><option value="スポンジ通し" '+(selectedValue==="スポンジ通し"?"selected":"")+'>スポンジ通し</option><option value="フィルター洗浄" '+(selectedValue==="フィルター洗浄"?"selected":"")+'>フィルター洗浄</option><option value="カラン洗浄" '+(selectedValue==="カラン洗浄"?"selected":"")+'>カラン洗浄</option><option value="custom" '+(isCustom?"selected":"")+'>直接入力（その他）</option></select><input class="item-custom-input" type="text" value="'+(isCustom?escAttr(item.name):"")+'" placeholder="項目名を入力" style="display:'+(isCustom?"block":"none")+';"></div>'}
function handleItemSelectChange(selectElem){const container=selectElem.closest(".item-name-editor");const inputElem=container.querySelector(".item-custom-input");if(selectElem.value==="custom"){inputElem.style.display="block";inputElem.value="";inputElem.placeholder="項目名を入力";inputElem.focus()}else{inputElem.style.display="none";inputElem.value=selectElem.value}markCardDirtyFromDom(selectElem.closest(".server-form-card"))}
function renderServerEditors(type){const container=document.getElementById(type==="beer"?"beerServers":"sourServers");if(!container)return;container.innerHTML="";const typeServers=appData.servers.filter(server=>server.type===type);typeServers.forEach((server,serverIndex)=>{const card=document.createElement("div");card.className="server-form-card";card.dataset.serverId=server.id;if(!setupNewCards.has(server.id))setupSnapshots.set(server.id,serverSnapshot(server));const itemHtml=server.items.map((item,index)=>{if(index<2)return itemConfigHtml(item,"標準項目 "+(index+1),false);return'<div class="optional-item-box"><div class="optional-item-head"><label>任意項目</label><button class="danger-button item-delete-button" type="button">削除</button></div>'+itemConfigHtml(item,"",true)+"</div>"}).join("");const placeholder=serverNamePlaceholder(type);card.innerHTML='<div class="problem-marker" aria-hidden="true">!</div><div class="server-form-head"><div class="field"><label>サーバー名</label><input class="server-name-input" type="text" value="'+escAttr(server.name)+'" placeholder="'+escAttr(placeholder)+'"></div>'+(serverIndex>0?'<button class="danger-button server-delete" type="button">削除</button>':"")+'</div><div class="server-items">'+itemHtml+"</div>"+(server.items.length<3?'<div class="add-button-wrap"><button class="add-button optional-add-button" type="button">＋ 項目を追加</button></div>':"")+'<div class="server-local-actions"><button class="secondary-button server-cancel-button" type="button">キャンセル</button><button class="primary-button server-save-button" type="button" disabled>保存</button></div>';container.appendChild(card);card.querySelector(".server-delete")?.addEventListener("click",()=>deleteServer(server.id,type));card.querySelector(".optional-add-button")?.addEventListener("click",()=>addOptional(server.id,type));card.querySelector(".item-delete-button")?.addEventListener("click",()=>deleteOptional(server.id,type));card.querySelector(".server-save-button")?.addEventListener("click",()=>saveServerCard(server.id,type));card.querySelector(".server-cancel-button")?.addEventListener("click",()=>cancelServerCard(server.id,type))});bindSetupInputCommitHandlers()}
function itemConfigHtml(item,label,optional){return'<div class="field item-field">'+(label?"<label>"+label+"</label>":"")+'<div class="item-config">'+itemNameEditorHtml(item)+'<input class="item-days-input" type="number" min="1" max="3650" value="'+(Number(item.days)||7)+'" title="締切日数"><label class="item-signal-label"><input class="item-signal-input" type="checkbox" '+(item.signal?"checked":"")+"> 締切日強調</label></div></div>"}
function addServer(type){discardEmptyNewCards(type);const server=createServer(type,"");appData.servers.push(server);setupNewCards.add(server.id);renderServerEditors(type);const newCard=document.querySelector('[data-server-id="'+CSS.escape(server.id)+'"]');if(newCard){markCardDirtyFromDom(newCard);newCard.querySelector(".server-name-input")?.focus()}}
function discardEmptyNewCards(type){const ids=appData.servers.filter(s=>s.type===type&&setupNewCards.has(s.id)).map(s=>s.id);for(const id of ids){const server=appData.servers.find(s=>s.id===id);if(!server)continue;const hasMeaningful=server.name.trim()||server.items.some((item,index)=>index>=2&&item.name.trim());if(!hasMeaningful){appData.servers=appData.servers.filter(s=>s.id!==id);setupNewCards.delete(id);setupSnapshots.delete(id);setupErrors.delete(id)}}}
function serverNamePlaceholder(type){const count=appData.servers.filter(server=>server.type===type).length;if(type==="sour"){if(count===2)return"テーブルの並び順に合わせると管理がスムーズです";if(count>=3)return"他のサーバーと重複しない名前を付けてください。";return"例：A1"}if(count===1)return"例：厨房手前";return"他のサーバーと重複しない名前を付けてください。"}
function addOptional(serverId,type){const server=appData.servers.find(x=>x.id===serverId);if(!server||server.items.length>=3)return;server.items.push({id:crypto.randomUUID(),name:"",days:7,signal:true,history:[],lastCleanedAt:null});renderServerEditors(type);const card=document.querySelector('[data-server-id="'+CSS.escape(serverId)+'"]');if(card)markCardDirtyFromDom(card)}
function deleteOptional(serverId,type){const server=appData.servers.find(x=>x.id===serverId);if(!server||server.items.length!==3)return;if(!window.confirm("3つ目の任意項目を削除しますか？\nこの項目の履歴も削除されます。"))return;server.items.splice(2,1);renderServerEditors(type);const card=document.querySelector('[data-server-id="'+CSS.escape(serverId)+'"]');if(card)markCardDirtyFromDom(card)}
function deleteServer(serverId,type){const count=appData.servers.filter(x=>x.type===type).length;if(count<=1){showToast("ビールとサワーは、それぞれ1台以上必要です。");return}if(!window.confirm("このサーバーを削除しますか？\nこのサーバーに紐づく履歴も削除されます。"))return;appData.servers=appData.servers.filter(x=>x.id!==serverId);setupSnapshots.delete(serverId);setupNewCards.delete(serverId);setupErrors.delete(serverId);renderServerEditors(type)}
function saveServerCard(serverId,type){const card=document.querySelector('[data-server-id="'+CSS.escape(serverId)+'"]');if(!card)return;syncCardToWorkingData(card);const data=readServerCard(card);if(!data)return;let error="";if(!data.name)error="サーバー名を入力してください。";else{const names=appData.servers.filter(s=>s.id!==serverId).map(s=>s.name.trim());if(names.includes(data.name))error="他のサーバーと重複しない名前を付けてください。";const badItem=data.items.findIndex(x=>!x.name);if(badItem>=0){error="項目名を入力してください。"}else{const itemNames=data.items.map(x=>x.name.trim());const hasDuplicate=itemNames.some((name,idx)=>itemNames.indexOf(name)!==idx);if(hasDuplicate)error="項目が重複しています"}}if(error){setupErrors.add(serverId);updateProblemMarker(card);alert(error);return}setupErrors.delete(serverId);setupSnapshots.set(serverId,serverSnapshot(data.server));setupNewCards.delete(serverId);card.classList.remove("is-dirty");card.querySelector(".server-save-button").disabled=true;updateProblemMarker(card)}
function cancelServerCard(serverId,type){if(setupNewCards.has(serverId)){appData.servers=appData.servers.filter(s=>s.id!==serverId);setupNewCards.delete(serverId);setupSnapshots.delete(serverId);setupErrors.delete(serverId)}else{restoreServerSnapshot(serverId);setupErrors.delete(serverId)}renderServerEditors(type)}
function unfinishedSetupCards(){const cards=[...document.querySelectorAll(".server-form-card")];const pending=[];cards.forEach(card=>{const save=card.querySelector(".server-save-button");if(save&&!save.disabled)pending.push(card)});return pending}
function finishSetup(){const shopNameInput=document.getElementById("shopName");if(shopNameInput&&!shopNameInput.value.trim()){alert("店名を入力してください。");shopNameInput.focus();return}for(const type of["beer","sour"])discardEmptyNewCards(type);renderServerEditors("beer");renderServerEditors("sour");const pending=unfinishedSetupCards();if(pending.length){pending.forEach(card=>{setupErrors.add(card.dataset.serverId);updateProblemMarker(card)});alert("保存していないサーバーがあります");pending[0].scrollIntoView({behavior:"smooth",block:"center"});return}const beer=appData.servers.filter(s=>s.type==="beer");const sour=appData.servers.filter(s=>s.type==="sour");if(!beer.length||!sour.length){alert("ビールサーバーとサワーサーバーを、それぞれ1台以上登録してください。");return}if(appData.servers.some(s=>!s.name.trim()||s.items.length<2||s.items.some(i=>!i.name.trim()))){alert("サーバー名と項目名を確認してください。");return}const shopName=shopNameInput?shopNameInput.value.trim():appData.shopName;const selectedBadge=document.querySelector(".shop-badge-option.selected")?.dataset.badgeColor||appData.shopBadgeColor||DEFAULT_SHOP_BADGE_COLOR;appData.shopName=shopName;appData.shopBadgeColor=selectedBadge;appData.version=2;saveAppData();setupBackup=null;setupInitial=false;updateHeader();renderMain();showToast("設定を保存しました。")}
function renderMain(){currentMode="M1";window.scrollTo(0,0);document.documentElement.scrollTop=0;document.body.scrollTop=0;updateHeader();document.getElementById("app").innerHTML='<div class="fixed-controls"><nav class="tabs" aria-label="入力方法"><button class="tab active" data-mode="M1">M1.締め切り順に入力</button><button class="tab" data-mode="M2">M2.項目順に入力</button><button class="tab" data-mode="M3">M3.サーバー順に入力</button></nav><div class="action-row" id="mainActions"></div></div><section id="content" class="page"></section>';document.querySelectorAll(".tab").forEach(button=>{button.onclick=()=>switchMode(button.dataset.mode)});renderCurrent()}
function switchMode(mode){currentMode=mode;document.querySelectorAll(".tab").forEach(tab=>tab.classList.toggle("active",tab.dataset.mode===mode));renderCurrent()}
function setMainActions(kind){const row=document.getElementById("mainActions");if(kind==="m2"){row.innerHTML='<button class="primary-button" type="button" id="saveButton">保存</button><button class="secondary-button" type="button" id="cancelButton">キャンセル</button>';document.getElementById("saveButton").onclick=saveSelected;document.getElementById("cancelButton").onclick=()=>renderM2()}else{row.innerHTML='<button class="primary-button" type="button" id="saveButton">保存</button><button class="secondary-button" type="button" id="clearButton">選択クリヤー</button>';document.getElementById("saveButton").onclick=saveSelected;document.getElementById("clearButton").onclick=clearSelection}}
function renderCurrent(){if(currentMode==="M1")renderM1();else if(currentMode==="M2")renderM2();else renderM3()}
function deadlineFor(item){if(!item.lastCleanedAt)return null;const base=new Date(item.lastCleanedAt);base.setHours(0,0,0,0);base.setDate(base.getDate()+Number(item.days));return base}
function signalFor(item){if(!item.lastCleanedAt)return"white";if(!item.signal)return"white";const deadline=deadlineFor(item);const today=new Date();today.setHours(0,0,0,0);const diff=Math.round((deadline-today)/86400000);if(diff<=0)return"red";if(diff<=2)return"yellow";return"white"}
function deadlineBadgeHtml(item){const state=signalFor(item)||"white";return'<span class="deadline-badge badge-'+state+'">締切日</span>'}
function deadlineText(item){const d=deadlineFor(item);if(!d)return"未設定";return(d.getMonth()+1)+"/"+d.getDate()}
function renderM1(){setMainActions("normal");const content=document.getElementById("content");const beer=sortServers(appData.servers.filter(s=>s.type==="beer"));const sour=sortServers(appData.servers.filter(s=>s.type==="sour"));content.innerHTML=sectionHtml("ビール",beer)+sectionHtml("サワー",sour);restoreWorkingSelection()}
function sectionHtml(title,servers){return'<div class="section-title">'+title+"</div>"+servers.map(serverCardHtml).join("")}
function serverCardHtml(server){return'<article class="server-card '+server.type+'"><div class="server-card-head"><div class="server-name">'+esc(server.name)+'</div></div><div class="item-list">'+server.items.map(item=>itemRowHtml(server,item)).join("")+"</div></article>"}
function itemRowHtml(server,item){return'<div class="item-row"><div class="item-label"><label><input type="checkbox" data-server-id="'+escAttr(server.id)+'" data-item-id="'+escAttr(item.id)+'"><span class="item-name">'+esc(item.name)+'</span></label></div><div class="deadline-grid"><div class="deadline-badge-cell">'+deadlineBadgeHtml(item)+'</div><div class="deadline-date-cell">'+deadlineText(item)+'</div></div></div>'}
function sortServers(servers){return[...servers].sort((a,b)=>priority(a)-priority(b))}
function priority(server){let best=Number.MAX_SAFE_INTEGER;for(const item of server.items){const d=deadlineFor(item);if(d)best=Math.min(best,d.getTime())}return best}
function renderM2(){setMainActions("m2");const content=document.getElementById("content");const items=[...new Set(appData.servers.flatMap(server=>server.items.map(item=>item.name).filter(Boolean)))];content.innerHTML='<div class="entry-screen m2-screen"><h2 class="entry-title">項目を選ぶ</h2><p class="entry-description">入力する項目を1つ選ぶと、対象となるサーバーが下に表示されます。</p><div class="m2-item-choices">'+items.map((name,index)=>'<label class="choice m2-item-choice"><input type="radio" name="m2item" class="m2item" data-name="'+escAttr(name)+'"><span>'+esc(name)+'</span></label>').join("")+'</div><div id="m2Servers" class="m2-servers"></div></div>';document.querySelectorAll(".m2item").forEach(radio=>{radio.addEventListener("change",()=>renderM2Servers(radio.dataset.name))});restoreWorkingSelection()}
function renderM2Servers(itemName){const target=document.getElementById("m2Servers");if(!target)return;const servers=appData.servers.filter(server=>server.items.some(item=>item.name===itemName)).sort((a,b)=>{const typeOrder={beer:0,sour:1};return(typeOrder[a.type]-typeOrder[b.type])||(appData.servers.indexOf(a)-appData.servers.indexOf(b))});target.innerHTML='<h3 class="selected-item-title">'+esc(itemName)+'</h3><p class="entry-description">対象サーバーを選択してください。</p><div class="m2-server-list">'+servers.map(server=>{const item=server.items.find(x=>x.name===itemName);return'<label class="m2-server-tile '+server.type+'"><input type="checkbox" class="m2server" data-server-id="'+escAttr(server.id)+'" data-item-id="'+escAttr(item.id)+'"><span class="m2-server-name">'+esc(server.name)+'</span><div class="deadline-grid"><div class="deadline-badge-cell">'+deadlineBadgeHtml(item)+'</div><div class="deadline-date-cell">'+deadlineText(item)+'</div></div></label>'}).join("")+"</div>";restoreWorkingSelection()}
function renderM3(){setMainActions("normal");const content=document.getElementById("content");const beer=appData.servers.filter(s=>s.type==="beer");const sour=appData.servers.filter(s=>s.type==="sour");content.innerHTML=sectionHtml("ビール",beer)+sectionHtml("サワー",sour);restoreWorkingSelection()}
function saveSelected(){const pairs=checkedPairs();if(!pairs.length){alert("保存する項目を選択してください。");return}captureWorkingSelection();if(!ensureFreshBeforeSave())return;showConfirm(pairs.length+"件保存しますか？").then(ok=>{if(!ok)return;if(!ensureFreshBeforeSave())return;const now=new Date().toISOString();pairs.forEach(pair=>{const server=appData.servers.find(s=>s.id===pair.serverId);const item=server?.items.find(i=>i.id===pair.itemId);if(!item)return;item.lastCleanedAt=now;item.history=Array.isArray(item.history)?item.history:[];item.history.push(now)});saveAppData();workingClear();if(currentMode==="M1")renderM1();else if(currentMode==="M2")renderM2();else renderM3()})}
function clearSelection(){document.querySelectorAll("input[type=checkbox][data-server-id][data-item-id]").forEach(cb=>cb.checked=false);workingClear()}

function openMenu(){
  if(document.querySelector(".menu-backdrop"))return;
  const backdrop=document.createElement("div");
  backdrop.className="menu-backdrop";
  backdrop.innerHTML='<aside class="menu-drawer" role="dialog" aria-label="メニュー"><h2>メニュー</h2><div class="page-scale-row"><span>ページサイズ</span><button type="button" data-scale-minus aria-label="ページサイズを小さく">−</button><span class="page-scale-value" id="pageScaleValue">'+pageScale+'%</span><button type="button" data-scale-plus aria-label="ページサイズを大きく">＋</button></div><button class="menu-item" type="button" data-settings>設定</button><button class="menu-item" type="button" data-shop-name>特別メニュー：店名変更</button><button class="menu-item" type="button" data-export>データを含めてアプリを書き出し</button><button class="menu-item" type="button" data-manual>取扱説明書</button><button class="menu-item menu-item-danger" type="button" data-reset>すべて初期化</button><p class="menu-note">初期化すると店名、サーバー、項目、洗浄履歴をすべて削除します。</p><div class="menu-generator-spacer"></div><button class="menu-item menu-item-generator" type="button" data-general>全般項目版を生成</button></aside>';

  backdrop.querySelector("[data-shop-name]").onclick=()=>{backdrop.remove();openShopNameChange()};
  backdrop.querySelector("[data-export]").onclick=()=>{backdrop.remove();exportSelf()};
  backdrop.querySelector("[data-manual]").onclick=()=>{backdrop.remove();showToast("取扱説明書は準備中です。")};
  backdrop.querySelector("[data-reset]").onclick=()=>{backdrop.remove();resetAppData()};
  backdrop.querySelector("[data-general]").onclick=()=>{backdrop.remove();showConfirm("全般項目版を生成しますか？","確認").then(ok=>{if(ok)generateGeneralApp()})};
}

function exportSelf(){
  const data=dbGet(STORAGE_KEY);
  if(!data){alert("保存されているデータがありません。");return}
  const json=JSON.stringify(data);
  const html=document.documentElement.outerHTML;
  const replacement='const EMBEDDED_DATA='+JSON.stringify(json)+';';
  let out=html.replace(/const EMBEDDED_DATA=("[^"]*"|'[^']*'|"");/,replacement);
  if(out===html)out=html.replace("const EMBEDDED_DATA=\"\";",replacement);
  const shopName=(data.shopName||"サーバー管理アプリ").replace(/[\\/:*?"<>|]/g,"_");
  const d=new Date();
  const dateStr=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const fileName=shopName+"_サーバー管理アプリ_"+dateStr+".html";
  const blob=new Blob([out],{type:"text/html;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=fileName;document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast("アプリを書き出しました。");
}

ewCards=new Set(),setupErrors=new Set(),staleDialogOpen=false;\nfunction uid(){return crypto.randomUUID()}\nfunction dbGet(key){try{return JSON.parse(localStorage.getItem(key))}catch(e){return null}}\nfunction dbSet(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch(e){console.warn(\"保存に失敗しました\",e);alert(\"ブラウザの保存領域に書き込めませんでした。空き容量やブラウザの設定を確認してください。\")}}\nfunction dbDelete(key){try{localStorage.removeItem(key)}catch(e){}}\nfunction revisionGet(){try{return Number(localStorage.getItem(REVISION_KEY))||0}catch(e){return 0}}\nfunction revisionSet(value){try{localStorage.setItem(REVISION_KEY,String(value))}catch(e){}}\nfunction revisionNext(){const next=revisionGet()+1;revisionSet(next);return next}\nfunction saveAppData(){appData.updatedAt=new Date().toISOString();appData.revision=revisionNext();dbSet(STORAGE_KEY,appData);return appData.revision}\nfunction workingGet(){try{return JSON.parse(sessionStorage.getItem(WORKING_KEY))}catch(e){return null}}\nfunction workingSet(value){try{if(value&&Array.isArray(value.checks)&&value.checks.length)sessionStorage.setItem(WORKING_KEY,JSON.stringify(value));else sessionStorage.removeItem(WORKING_KEY)}catch(e){}}\nfunction workingClear(){try{sessionStorage.removeItem(WORKING_KEY)}catch(e){}}\nfunction createItem(source={}){return{id:source.id||uid(),name:source.name||\"\",days:Math.max(1,Number(source.days)||7),signal:source.signal!==false,history:Array.isArray(source.history)?[...source.history]:[],lastCleanedAt:source.lastCleanedAt||null}}\nfunction createSampleTargets(){return SAMPLE_TARGETS.map(t=>({id:uid(),name:t.name,items:t.items.map(i=>createItem(i))}))}\nfunction createEmptyData(shopName=\"\"){return{version:1,shopName:shopName||\"\",shopBadgeColor:DEFAULT_SHOP_BADGE_COLOR,targets:createSampleTargets(),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),revision:0}}\nfunction normalizeData(){if(!appData||!Array.isArray(appData.targets))appData=createEmptyData(INITIAL_STORE_NAME);appData.shopName=appData.shopName||\"\";if(!SHOP_BADGE_COLORS[appData.shopBadgeColor])appData.shopBadgeColor=DEFAULT_SHOP_BADGE_COLOR;appData.targets.forEach(target=>{target.id=target.id||uid();target.name=target.name||\"\";target.items=Array.isArray(target.items)?target.items:[];target.items.forEach(item=>{item.id=item.id||uid();item.name=item.name||\"\";item.days=Math.max(1,Number(item.days)||7);item.signal=item.signal!==false;item.history=Array.isArray(item.history)?item.history:[];item.lastCleanedAt=item.lastCleanedAt||null})})}\nfunction updateHeader(){const el=document.getElementById(\"storeNameHeader\");if(!el)return;const color=SHOP_BADGE_COLORS[appData?.shopBadgeColor]?appData.shopBadgeColor:DEFAULT_SHOP_BADGE_COLOR;const text=el.querySelector(\".store-name-text\");if(text)text.textContent=appData?.shopName||\"\";el.className=\"store-name \"+SHOP_BADGE_COLORS[color].className;fitShopBadgeText(el)}\nfunction readLatestSavedData(){const data=dbGet(STORAGE_KEY);return data&&Array.isArray(data.targets)?data:null}\nfunction ensureFreshBeforeSave(){const current=revisionGet();const pageRevision=Number(appData?.revision)||0;if(current!==pageRevision){showStalePageDialog();return false}return true}\nfunction checkForStalePage(){if(!appData||staleDialogOpen)return;const current=revisionGet();const pageRevision=Number(appData.revision)||0;if(current&&current!==pageRevision)showStalePageDialog()}\nfunction showStalePageDialog(){if(staleDialogOpen)return;staleDialogOpen=true;const root=document.getElementById(\"modalRoot\");const latest=readLatestSavedData();const updated=latest?.updatedAt?formatRelativeSavedTime(latest.updatedAt):\"\";root.innerHTML='<div class=\"modal-backdrop\"><div class=\"modal\" role=\"dialog\" aria-modal=\"true\"><h2>古いページを見ています。</h2><p>別のタブで更新されています。<br>最新の保存は'+esc(updated||\"以前\")+'です。</p><div class=\"modal-actions\"><button class=\"secondary-button\" type=\"button\" data-close>このページを閉じる</button><button class=\"primary-button\" type=\"button\" data-latest>最新にする</button></div></div></div>';root.querySelector(\"[data-close]\").onclick=()=>{staleDialogOpen=false;closeCurrentPage()};root.querySelector(\"[data-latest]\").onclick=()=>{staleDialogOpen=false;root.innerHTML=\"\";appData=readLatestSavedData();if(!appData)return;normalizeData();updateHeader();renderMain();restoreWorkingSelection();showToast(\"最新の状態に更新しました。\")} }\nfunction formatRelativeSavedTime(iso){const time=new Date(iso).getTime();if(!Number.isFinite(time))return\"以前\";const diff=Math.max(0,Date.now()-time);const minutes=Math.floor(diff/60000);if(minutes<1)return\"1分未満前\";if(minutes<60)return minutes+\"分前\";const hours=Math.floor(minutes/60);if(hours<24)return hours+\"時間\"+(minutes%60?minutes%60+\"分\":\"\")+\"前\";return Math.floor(hours/24)+\"日前\"}\nfunction closeCurrentPage(){try{window.close()}catch(e){}setTimeout(()=>{if(!document.hidden)location.href=\"about:blank\"},100)}\ndocument.addEventListener(\"DOMContentLoaded\",init);\ndocument.addEventListener(\"change\",event=>{if(event.target.matches('input[type=\"checkbox\"][data-target-id][data-item-id]'))captureWorkingSelection()});\nwindow.addEventListener(\"storage\",event=>{if(event.key===STORAGE_KEY||event.key===REVISION_KEY)checkForStalePage()});document.addEventListener(\"visibilitychange\",()=>{if(!document.hidden)checkForStalePage()});window.addEventListener(\"pageshow\",checkForStalePage);\nfunction init(){document.getElementById(\"menuButton\").addEventListener(\"click\",openMenu);let restored=false;if(EMBEDDED_DATA){try{const embedded=JSON.parse(EMBEDDED_DATA);if(embedded&&Array.isArray(embedded.targets)&&!dbGet(STORAGE_KEY)){appData=embedded;appData.revision=revisionNext();dbSet(STORAGE_KEY,appData);restored=true}}catch(e){console.warn(\"EMBEDDED_DATA parse failed\",e)}}appData=dbGet(STORAGE_KEY);if(!appData){appData=createEmptyData(INITIAL_STORE_NAME);renderSetup(false,true);return}normalizeData();if(!appData.revision){appData.revision=revisionGet()||revisionNext();dbSet(STORAGE_KEY,appData)}else if(revisionGet()!==Number(appData.revision))revisionSet(Number(appData.revision));updateHeader();renderMain();restoreWorkingSelection();applyPageScale();if(restored)showToast(\"バックアップデータを読み込みました\") }\nfunction setupSnapshot(target){return JSON.parse(JSON.stringify(target))}\nfunction restoreTargetSnapshot(targetId){const snapshot=setupSnapshots.get(targetId);if(!snapshot)return false;const index=appData.targets.findIndex(t=>t.id===targetId);if(index<0)return false;appData.targets[index]=JSON.parse(JSON.stringify(snapshot));return true}\nfunction renderSetup(edit,firstTime){setupSnapshots=new Map();setupNewCards=new Set();setupErrors=new Set();const app=document.getElementById(\"app\");const title=firstTime?\"初期設定\":\"設定\";const shopBlock=firstTime?'<div class=\"field\"><label for=\"shopName\">店舗名</label><input id=\"shopName\" type=\"text\" value=\"'+escAttr(appData.shopName)+'\" placeholder=\"例：○○店\"></div>'+shopBadgePickerHtml(appData.shopName,appData.shopBadgeColor):'<div class=\"field\"><label>店舗名</label><div class=\"registered-shop-name\">'+esc(appData.shopName)+'</div><p class=\"notice\">店舗名は初回設定後、変更できません。バッヂの色は下から変更できます。</p></div>'+shopBadgePickerHtml(appData.shopName,appData.shopBadgeColor);app.innerHTML='<section class=\"setup-wrap\"><h1>'+title+'</h1>'+(firstTime?'<p class=\"setup-intro\">店舗名と対象物・作業項目を確認してください。各対象物は、対象物単位で保存できます。</p>':'')+'<div class=\"form-card shop-form-card\"><h2>店舗</h2>'+shopBlock+'</div><div class=\"form-card\"><h2>対象物・作業項目</h2><p class=\"notice\">対象物名、作業項目名、締切日数は自由に編集できます。作業項目を削除すると、その項目の履歴も削除されます。</p><div id=\"targetEditors\"></div><div class=\"add-button-wrap\"><button class=\"add-button\" type=\"button\" id=\"addTargetButton\">＋ 対象物を追加</button></div></div><div class=\"setup-finish-bar\"><button type=\"button\" id=\"finishSetupButton\">'+(firstTime?'設定を完了して開始':'設定を保存')+'</button></div></section>';renderTargetEditors();bindSetupInputCommitHandlers();bindShopBadgePicker();document.getElementById(\"addTargetButton\").onclick=addTarget;document.getElementById(\"finishSetupButton\").onclick=finishSetup;applyPageScale()}\nfunction readTargetCard(card){const target=appData.targets.find(t=>t.id===card.dataset.targetId);if(!target)return null;const name=card.querySelector(\".target-name-input\")?.value.trim()??target.name;const items=[...card.querySelectorAll(\".general-item-config\")].map(row=>({id:row.dataset.itemId,name:row.querySelector(\".general-item-name\")?.value.trim()||\"\",days:Math.max(1,Math.min(3650,Number(row.querySelector(\".item-days-input\")?.value)||7)),signal:!!row.querySelector(\".item-signal-input\")?.checked}));return{target,name,items}}\nfunction syncTargetCardToWorkingData(card){const data=readTargetCard(card);if(!data)return;const {target,name,items}=data;const renamed=target.name!==name;const existing=new Map(target.items.map(item=>[item.id,item]));const nextItems=items.map(entry=>{const old=existing.get(entry.id)||createItem({id:entry.id});if(old.name!==entry.name){old.name=entry.name;old.history=[];old.lastCleanedAt=null}old.days=entry.days;old.signal=entry.signal;if(renamed){old.history=[];old.lastCleanedAt=null}return old});target.name=name;if(renamed)target.items.forEach(item=>{item.history=[];item.lastCleanedAt=null});target.items=nextItems}\nfunction syncAllTargetCards(){document.querySelectorAll(\".target-form-card\").forEach(syncTargetCardToWorkingData)}\nfunction cardMeaningfulStateFromDom(card){const data=readTargetCard(card);if(!data)return null;return{name:data.name,items:data.items.map(item=>({name:item.name,days:item.days,signal:item.signal}))}}\nfunction cardMeaningfulStateFromTarget(target){return{name:target.name,items:target.items.map(item=>({name:item.name,days:item.days,signal:item.signal}))}}\nfunction markTargetCardDirtyFromDom(card){if(!card)return;syncTargetCardToWorkingData(card);const id=card.dataset.targetId;const current=cardMeaningfulStateFromDom(card);const snapshot=setupSnapshots.get(id);const dirty=!snapshot||JSON.stringify(current)!==JSON.stringify(cardMeaningfulStateFromTarget(snapshot));card.classList.toggle(\"is-dirty\",dirty);const save=card.querySelector(\".server-save-button\");if(save)save.disabled=!dirty;if(dirty)setupErrors.delete(id);updateTargetProblemMarker(card)}\nfunction updateTargetProblemMarker(card){const marker=card.querySelector(\".problem-marker\");if(marker)marker.classList.toggle(\"visible\",setupErrors.has(card.dataset.targetId))}\nfunction bindSetupInputCommitHandlers(){document.querySelectorAll(\".target-form-card .target-name-input,.target-form-card .general-item-name,.target-form-card .item-days-input\").forEach(input=>{input.removeEventListener(\"input\",handleSetupInputChange);input.addEventListener(\"input\",handleSetupInputChange)});document.querySelectorAll(\".target-form-card .item-signal-input\").forEach(input=>{input.removeEventListener(\"change\",handleSetupInputChange);input.addEventListener(\"change\",handleSetupInputChange)})}\nfunction handleSetupInputChange(event){const card=event.target.closest(\".target-form-card\");if(card)markTargetCardDirtyFromDom(card)}\nfunction taskEditorHtml(item){return'<div class=\"field item-field\"><div class=\"general-item-config\" data-item-id=\"'+escAttr(item.id)+'\"><input class=\"general-item-name\" type=\"text\" value=\"'+escAttr(item.name)+'\" placeholder=\"作業項目名\"><input class=\"item-days-input\" type=\"number\" min=\"1\" max=\"3650\" value=\"'+Number(item.days||7)+'\" title=\"締切日数\"><label class=\"item-signal-label\"><input class=\"item-signal-input\" type=\"checkbox\" '+(item.signal!==false?'checked':'')+'> 締切日強調</label><button class=\"task-delete-button\" type=\"button\" data-delete-item=\"'+escAttr(item.id)+'\">削除</button></div></div>'}\nfunction renderTargetEditors(){const container=document.getElementById(\"targetEditors\");if(!container)return;container.innerHTML=\"\";appData.targets.forEach((target,index)=>{const card=document.createElement(\"div\");card.className=\"server-form-card target-form-card\";card.dataset.targetId=target.id;if(!setupNewCards.has(target.id)&&!setupSnapshots.has(target.id))setupSnapshots.set(target.id,setupSnapshot(target));const tasks=target.items.map(taskEditorHtml).join(\"\");card.innerHTML='<div class=\"problem-marker\" aria-hidden=\"true\">!</div><div class=\"server-form-head\"><div class=\"field\"><label>対象物 '+(index+1)+'</label><input class=\"target-name-input\" type=\"text\" value=\"'+escAttr(target.name)+'\" placeholder=\"対象物名（例：製氷機）\"></div></div><div class=\"server-items\">'+tasks+'</div><div class=\"add-button-wrap\"><button class=\"add-button add-task-button\" type=\"button\">＋ 作業項目を追加</button></div><div class=\"server-local-actions\"><button class=\"secondary-button target-cancel-button\" type=\"button\">キャンセル</button><button class=\"danger-button target-delete-button\" type=\"button\">削除</button><button class=\"primary-button server-save-button\" type=\"button\" disabled>保存</button></div>';container.appendChild(card);card.querySelector(\".add-task-button\").onclick=()=>addTask(target.id);card.querySelectorAll(\"[data-delete-item]\").forEach(button=>button.onclick=()=>deleteTask(target.id,button.dataset.deleteItem));card.querySelector(\".target-delete-button\").onclick=()=>deleteTarget(target.id);card.querySelector(\".target-cancel-button\").onclick=()=>cancelTargetCard(target.id);card.querySelector(\".server-save-button\").onclick=()=>saveTargetCard(target.id);});bindSetupInputCommitHandlers();container.querySelectorAll(\".target-form-card\").forEach(card=>{const id=card.dataset.targetId;const current=cardMeaningfulStateFromDom(card);const snapshot=setupSnapshots.get(id);const dirty=!snapshot||JSON.stringify(current)!==JSON.stringify(cardMeaningfulStateFromTarget(snapshot));card.classList.toggle(\"is-dirty\",dirty);const save=card.querySelector(\".server-save-button\");if(save)save.disabled=!dirty;updateTargetProblemMarker(card)})}\nfunction addTarget(){syncAllTargetCards();const target={id:uid(),name:\"\",items:[]};appData.targe function generateGeneralApp(){
  const shopName=String(appData?.shopName||"").trim();
  if(!shopName){alert("店舗名が未登録です。先に店舗名を登録してください。");return}
  const embeddedName=JSON.stringify(shopName).replace(/</g,"\\u003c").replace(/>/g,"\\u003e").replace(/&/g,"\\u0026");
  const out=GENERAL_APP_TEMPLATE.replace("__INITIAL_STORE_NAME__",embeddedName);
  const safeName=shopName.replace(/[\\/:*?"<>|]/g,"_").replace(/[. ]+$/g,"")||"店舗";
  const now=new Date();
  const dateStr=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
  const fileName=safeName+"_全般項目管理_"+dateStr+".html";
  const blob=new Blob([out],{type:"text/html;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=fileName;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast("全般版を生成しました。");
}

function resetAppData(){
  showConfirm("店名、サーバー、項目、洗浄履歴をすべて削除して初期設定に戻します。","すべて初期化").then(ok=>{
    if(!ok)return;
    dbDelete(STORAGE_KEY);dbDelete(REVISION_KEY);workingClear();
    appData=createEmptyData();
    setupBackup=null;setupInitial=true;setupSnapshots=new Map();setupNewCards=new Set();setupErrors=new Set();
    updateHeader();renderSetup(false,true);
    showToast("すべて初期化しました。");
  });
}

  root.querySelector("[data-save]").onclick=()=>{const value=root.querySelector("#shopNameChangeInput").value.trim();if(!value){alert("店名を入力してください。");return}const selectedBadge=root.querySelector(".shop-badge-option.selected")?.dataset.badgeColor||appData.shopBadgeColor||DEFAULT_SHOP_BADGE_COLOR;appData.shopName=value;appData.shopBadgeColor=selectedBadge;saveAppData();root.innerHTML="";updateHeader();renderMain();showToast("店名を変更しました。")};
}
function shopBadgePickerHtml(name,selectedColor){const selected=SHOP_BADGE_COLORS[selectedColor]?selectedColor:DEFAULT_SHOP_BADGE_COLOR;const safeName=name||"店舗名";return'<div class="shop-badge-picker"><div class="field"><label>店舗バッジ</label><p class="notice">店名を入力すると、下の10色に反映されます。使用する色を選択してください。</p></div><div class="shop-badge-options">'+Object.keys(SHOP_BADGE_COLORS).map(key=>'<button type="button" class="shop-badge-option store-name '+(selected===key?"selected":"")+" "+SHOP_BADGE_COLORS[key].className+'" data-badge-color="'+key+'" aria-label="'+SHOP_BADGE_NAMES[key]+'"><span class="store-name-text">'+esc(safeName)+'</span></button>').join("")+"</div></div>"}
function fitShopBadgeText(scope=document){const texts=[];if(scope instanceof Element&&scope.matches(".store-name-text")){texts.push(scope)}else if(scope instanceof Element||scope===document){texts.push(...scope.querySelectorAll(".store-name-text"))}texts.forEach(text=>{const box=text.parentElement;if(!box)return;text.style.fontSize="21px";text.style.lineHeight="1.05";const maxSize=21,minSize=10,step=0.5;const availableWidth=Math.max(1,box.clientWidth-4);const availableHeight=Math.max(1,box.clientHeight-2);let size=maxSize;while(size>minSize){text.style.fontSize=size+"px";text.style.lineHeight="1.05";if(text.scrollWidth<=availableWidth+1&&text.scrollHeight<=availableHeight+1)break;size-=step}text.style.fontSize=Math.max(minSize,size)+"px"})}
function bindShopBadgePicker(scope=document){const input=scope.querySelector("#shopName")||scope.querySelector("#shopNameChangeInput");const buttons=[...scope.querySelectorAll(".shop-badge-option")];if(!buttons.length)return;const refresh=()=>{const value=input?input.value:appData?.shopName||"";buttons.forEach(btn=>{const text=btn.querySelector(".store-name-text");if(text)text.textContent=value||"店舗名"});requestAnimationFrame(()=>fitShopBadgeText(scope))};buttons.forEach(btn=>{btn.onclick=()=>{buttons.forEach(x=>x.classList.remove("selected"));btn.classList.add("selected")}});if(input)input.addEventListener("input",refresh);refresh()}
function showConfirm(message,title="確認"){return new Promise(resolve=>{const root=document.getElementById("modalRoot");root.innerHTML='<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true"><h2>'+esc(title)+'</h2><p>'+esc(message)+'</p><div class="modal-actions"><button class="secondary-button" type="button" data-cancel>キャンセル</button><button class="primary-button" type="button" data-ok>OK</button></div></div></div>';root.querySelector("[data-cancel]").onclick=()=>{root.innerHTML="";resolve(false)};root.querySelector("[data-ok]").onclick=()=>{root.innerHTML="";resolve(true)}})}
function showToast(message){document.querySelector(".toast")?.remove();const toast=document.createElement("div");toast.className="toast";toast.textContent=message;document.body.appendChild(toast);setTimeout(()=>toast.remove(),2200)}
function esc(value){return String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function escAttr(value){return esc(value)}
</script>
